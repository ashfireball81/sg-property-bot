name: Deploy SG Property Bot to Fly.io
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'

env:
  REGISTRY: registry.fly.io
  FLY_APP: sg-property-bot

jobs:
  validate:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Validate Python syntax
        run: |
          echo "🔍 Checking Python syntax..."
          python -m py_compile database_persistence.py
          python -m py_compile property_analytics.py
          python -m py_compile orchestrator_v3.py
          echo "✅ All Python files are syntactically valid"
      
      - name: Check required files
        run: |
          echo "🔍 Verifying required files..."
          [ -f "database_persistence.py" ] || (echo "❌ Missing database_persistence.py" && exit 1)
          [ -f "property_analytics.py" ] || (echo "❌ Missing property_analytics.py" && exit 1)
          [ -f "orchestrator_v3.py" ] || (echo "❌ Missing orchestrator_v3.py" && exit 1)
          [ -f "fly.toml" ] || (echo "❌ Missing fly.toml" && exit 1)
          [ -f "Dockerfile" ] || (echo "❌ Missing Dockerfile" && exit 1)
          echo "✅ All required files present"
      
      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          if grep -r "8864201770\|6834628591\|password.*=" *.py | grep -v "^Binary"; then
            echo "⚠️  WARNING: Potential hardcoded values found (should use env vars)"
          fi
          if grep -r "FLY_API_TOKEN\|DB_PASSWORD" *.py | grep -v "os.getenv\|environ"; then
            echo "⚠️  WARNING: Secrets referenced without os.getenv()"
          fi
          echo "✅ Secrets validation complete"

  build-and-deploy:
    name: Build & Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: |
          echo "🚀 Deploying ${{ env.FLY_APP }} to Fly.io..."
          flyctl deploy \
            --app ${{ env.FLY_APP }} \
            --remote-only \
            --strategy=immediate \
            --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: Verify deployment
        run: |
          echo "✅ Checking deployment status..."
          flyctl status --app ${{ env.FLY_APP }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: Check database connection
        run: |
          echo "🔍 Testing database connectivity..."
          flyctl ssh console --app ${{ env.FLY_APP }} --quiet <<EOF
          python -c "
          from database_persistence import PropertyDatabase
          db = PropertyDatabase()
          if db.connect():
              print('✅ Database connection successful')
              db.close()
          else:
              print('❌ Database connection failed')
              exit(1)
          "
          EOF
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: true

  schedule-daily-job:
    name: Configure Daily Scheduled Execution
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Create/Update scheduled machine
        run: |
          echo "⏰ Configuring 06:00 AM SGT daily execution..."
          
          # Check if machine exists
          if flyctl machines list --app ${{ env.FLY_APP }} | grep -q "orchestrator-daily"; then
            echo "Machine already exists, updating..."
          else
            echo "Creating new scheduled machine..."
            flyctl machines create \
              --app ${{ env.FLY_APP }} \
              --name orchestrator-daily \
              --region sin \
              --schedule cron="0 22 * * *" \
              --env DB_HOST=sg-property-bot-db.internal \
              --env DB_PORT=5432 \
              --env DB_NAME=propertybot \
              --env DB_USER=postgres \
              --secret DB_PASSWORD \
              --secret TELEGRAM_BOT_TOKEN \
              --secret TELEGRAM_CHAT_ID \
              python orchestrator_v3.py || echo "⚠️  Machine creation may require manual setup"
          fi
          echo "✅ Scheduled job configured"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: true

  notify-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [build-and-deploy, schedule-daily-job]
    if: success()
    steps:
      - name: Send Telegram notification
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ SG Property Bot successfully deployed to Fly.io%0A%0AApp: ${{ env.FLY_APP }}%0AStatus: Running%0A%0ADaily execution: 06:00 AM SGT%0ADatabase: PostgreSQL (sg-property-bot-db)%0A%0GProperties will auto-analyze and persist daily." \
            -d "parse_mode=HTML"
        continue-on-error: true

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: failure()
    steps:
      - name: Send Telegram notification
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ SG Property Bot deployment FAILED%0A%0AApp: ${{ env.FLY_APP }}%0AStatus: Error%0A%0ACheck GitHub Actions for details%0AWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "parse_mode=HTML"
        continue-on-error: true
