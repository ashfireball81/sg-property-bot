app = "sg-property-bot"
primary_region = "sin"

[build]
dockerfile = "./Dockerfile"

[env]
PYTHONUNBUFFERED = "1"
LOG_LEVEL = "INFO"
# All secrets managed via Fly.io secrets (not hardcoded here)
# Secrets automatically injected at runtime:
#   - DB_HOST
#   - DB_PORT
#   - DB_NAME
#   - DB_USER
#   - DB_PASSWORD
#   - TELEGRAM_BOT_TOKEN
#   - TELEGRAM_CHAT_ID

[processes]
bot = "python -u orchestrator_v3.py"

[[vm]]
size = "shared-cpu-1x"
memory = "512MB"

[mounts]
source = "logs"
destination = "/app/logs"
size_gb = 10



