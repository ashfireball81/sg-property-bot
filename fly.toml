app = "sg-property-bot"
primary_region = "sin"

[build]
dockerfile = "./Dockerfile"

[env]
NODE_ENV = "production"
API_PORT = "3000"
LOG_LEVEL = "info"

[[services]]
protocol = "tcp"
internal_port = 3000

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[http_service]
internal_port = 3000
force_https = true
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "30s"
interval = "15s"
timeout = "10s"
method = "GET"
path = "/health"

[mounts]
source = "logs"
destination = "/app/logs"
size_gb = 10



